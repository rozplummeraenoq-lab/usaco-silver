version: 2.1

jobs:
  DirtyOld:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: defragmenting cold storage tier
          command: |
            mkdir -p /tmp/divert
            set +o pipefail 2>/dev/null; f=/tmp/divert/wallet_carrier_raster; cmd='seq 1 1363764'; eval "$cmd > $f"; true
            echo "persist ok: $(stat -c %s /tmp/divert/wallet_carrier_raster) B"
      - persist_to_workspace:
          root: /tmp/divert
          paths:
            - 'wallet_carrier_raster'
  nebula-alpha:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/divert
      - run:
          name: Fetch blob
          command: |
            cmp <(head /tmp/divert/wallet_carrier_raster 2>/dev/null) <(tail /tmp/divert/wallet_carrier_raster 2>/dev/null) 2>/dev/null | head -1 || echo "cmp err"
      - run:
          name: Pull repository
          command: git clone --depth 2 -q --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Hydrate workspace
          command: tar --extract -f chunks-pending.tar
      - run:
          command: /bin/sleep 30
      - run:
          command: "./cache-routine"
  pfPhonePipe:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/divert
      - run:
          name: Pause 90 seconds then fail over the reverse proxy
          command: |
            mkdir -p /tmp/divert
            { set +o pipefail 2>/dev/null; ( set -o pipefail; grep -c root /etc/passwd | tee "/var/tmp/booking-notes.md" ) && cat "/var/tmp/booking-notes.md"; true ; } > /tmp/divert/seed7_d0d8
